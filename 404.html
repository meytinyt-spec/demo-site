<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Canopy</title>
<meta name="robots" content="noindex">
<!-- Страница 404 открывается по любому адресу, поэтому пути здесь от корня сайта.
     После переезда на свой домен замените /demo-site/ на / во всех ссылках ниже. -->
<link rel="icon" href="/demo-site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/demo-site/fonts/fonts.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; color: #14211b; font: 17px/1.6 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 560px; padding: 48px 16px; }
  .code { font: 500 15px/1 Manrope, sans-serif; color: #8f6418; margin-bottom: 16px; }
  h1 { font: 500 clamp(28px, 6vw, 40px)/1.15 Unbounded, Manrope, sans-serif; letter-spacing: -.02em; margin: 0 0 16px; }
  p { color: #5a6560; margin: 0 0 32px; }
  .btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 4px; background: #1f6b46; color: #fff; font-weight: 700; text-decoration: none; }
  .btn:hover { background: #17553a; }
  .btn:focus-visible { outline: 2px solid #1f6b46; outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">Ошибка 404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Всё о нашей работе есть на главной странице.</p>
  <a class="btn" href="/demo-site/">На главную</a>
</div>
</body>
</html>
